services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobs
      DATABASE_USER: jobs
      DATABASE_PASSWORD: jobs
      API_ENABLED: "true"
      WORKER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobs
      DATABASE_USER: jobs
      DATABASE_PASSWORD: jobs
      API_ENABLED: "false"
      WORKER_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      WORKER_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobs
      DATABASE_USER: jobs
      DATABASE_PASSWORD: jobs
      API_ENABLED: "false"
      WORKER_ENABLED: "false"
      SCHEDULER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
