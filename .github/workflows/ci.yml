name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # PostgreSQL Testcontainers automatically starts a Docker container on the runner.
      - name: Unit and PostgreSQL integration tests
        run: mvn -B --no-transfer-progress clean verify
